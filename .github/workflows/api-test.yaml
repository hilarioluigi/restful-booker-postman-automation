name: API Automation Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        env: 
          AUTH_USER: ${{ secrets.POSTMAN_USERNAME }}
          AUTH_PASS: ${{ secrets.POSTMAN_PASSWORD }}
        run: |
          if [ -z "$AUTH_USER" ] || [ -z "$AUTH_PASS" ]; then
            echo "Error: Secrets are not being retrieved correctly."
            exit 1
          fi

          newman run Restful-Booker.postman_collection.json \
          -e Restful-Booker.postman_environment.json \
          --env-var "username=$AUTH_USER" \
          --env-var "password=$AUTH_PASS"