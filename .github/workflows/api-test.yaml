name: API Automation Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run restful-booker.json \
          -e Restful-Booker.postman_environment \
          --env-var "username=$AUTH_USER" \
          --env-var "password=$AUTH_PASS"